name: Telegram quick test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/send-test-trigger.txt"

concurrency:
  group: telegram-quick-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send quick Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT=$'Ассаляму алейкум!\n\nБыстрый тест от бота «Зангар». Проверяем отправку без очереди постов.'
          curl --fail --show-error --silent \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
