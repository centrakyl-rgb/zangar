<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Акыл центр</title>
<style>
:root{--n:#155A8A!important;--g:#2499D4!important;--m:#E5F5FD!important;--i:#15384E!important;--u:#6F8491!important;--l:#D8E8F0!important;--b:#F4FAFD!important}
:root{--n:#14324a;--g:#1e7c68;--m:#e8f5ef;--i:#18303e;--u:#71808a;--l:#dfe7e4;--b:#f5f8f7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--b);color:var(--i)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;padding:25px;display:grid;place-items:center;background:radial-gradient(circle at top left,#d8f2e7,transparent 45%),#f4f8f6}.card{width:min(100%,420px);background:#fff;border:1px solid var(--l);border-radius:25px;padding:25px;box-shadow:0 20px 50px #1535281c}.brand{display:flex;gap:13px;align-items:center;margin-bottom:23px}.logo{width:54px;height:54px;border-radius:17px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800}h1,h2,h3,p{margin-top:0}.brand h1{margin:0;font-size:26px}.brand p{margin:3px 0;color:var(--u);font-size:13px}label{display:block;color:var(--u);font-size:12px;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;background:#fff}textarea{min-height:75px}.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--n);color:#fff;font-weight:700}.btn.green,.login .btn{background:var(--g)}.login .btn{width:100%;margin-top:18px}.error{color:#b54b4b;font-size:13px;min-height:20px;margin-top:9px}.demo{background:var(--m);padding:12px;border-radius:12px;color:#456158;font-size:12px;line-height:1.6}.top{position:sticky;top:0;background:var(--n);color:#fff;padding:17px;z-index:2}.toprow{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:20px}.user{color:#cfe0e8;font-size:12px;margin-top:3px}.logout{color:#fff;border:1px solid #ffffff55;background:none;border-radius:11px;padding:8px 11px}.role{display:inline-block;margin-top:11px;background:#ffffff18;border-radius:99px;padding:6px 10px;font-size:11px}main{padding:16px;max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,var(--g),#255b68);color:#fff;border-radius:19px;padding:19px}.hero h2{margin-bottom:6px}.hero p{margin:0;color:#daf3eb;font-size:13px;line-height:1.5}.stats,.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats{margin-top:12px}.stat,.panel{background:#fff;border:1px solid var(--l);border-radius:16px;padding:15px}.stat strong{font-size:24px;display:block}.stat span{color:var(--u);font-size:11px}.panel{margin-top:12px}.panel h3{font-size:16px;margin-bottom:12px}.full{grid-column:1/-1}.list{display:grid;gap:8px}.item{border:1px solid var(--l);border-radius:13px;padding:11px;background:#fcfefd}.row{display:flex;justify-content:space-between;gap:8px}.item strong{font-size:13px}.item p{font-size:11px;color:var(--u);margin:5px 0 0;line-height:1.4}.badge{background:var(--m);color:var(--g);border-radius:99px;padding:4px 7px;font-size:10px;white-space:nowrap}.todo{background:#fff1d7;color:#83580b}.empty{text-align:center;color:var(--u);font-size:12px;padding:13px}.subjects{display:flex;overflow:auto;gap:6px;margin-top:12px}.subjects span{background:var(--m);color:var(--g);padding:7px 9px;border-radius:99px;font-size:10px;white-space:nowrap}@media(max-width:450px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style><style>
.section-hint{font-size:13px;font-weight:700;color:var(--u);margin:16px 3px 7px}.panel.section-card{padding:0;overflow:hidden;border-color:#cfe3ee;box-shadow:0 3px 12px #155a8a0d}.section-toggle{width:100%;min-height:60px;border:0;background:#fff;color:var(--i);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-size:16px;font-weight:800}.section-toggle:active{background:var(--m)}.section-arrow{width:32px;height:32px;border-radius:50%;background:var(--m);color:var(--g);display:grid;place-items:center;font-size:22px;flex:none}.section-body{padding:0 15px 16px}.section-card.closed .section-body{display:none}.section-card:not(.closed){border-color:var(--g)}
.top-actions{display:flex;align-items:center;gap:8px}.bell-wrap{position:relative}.bell{width:44px;height:44px;border:1px solid #ffffff55;border-radius:13px;background:#ffffff12;color:#fff;font-size:22px}.help-button{font-weight:900;font-size:20px}.notification-count{position:absolute;right:-4px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:12px;background:#e53935;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--n)}.notification-popover{position:fixed;left:12px;right:12px;top:92px;width:auto;max-height:60vh;overflow:auto;background:#fff;color:var(--i);border-radius:16px;padding:12px;box-shadow:0 12px 35px #001a2c55;border:1px solid var(--l)}.notification-popover h3{margin:2px 4px 10px}.notification-popover .item{margin-top:7px}.instruction-text{font-size:14px;line-height:1.55;color:var(--u);white-space:pre-line}
.top{padding:14px 16px 12px;box-shadow:0 2px 12px #092b421a}.top h1{font-size:22px}.role{margin-top:7px;padding:4px 9px}.logout{height:44px}.section-hint{font-size:20px;color:var(--i);margin:8px 3px 14px}.panel.section-card{margin-top:10px;border:0;border-radius:20px;box-shadow:0 4px 18px #15384e10}.section-toggle{min-height:72px;padding:16px 18px;font-size:17px}.section-arrow{background:#e6f5fc}.nav-hidden{display:none!important}.dashboard-nav{position:fixed;z-index:12;left:0;right:0;bottom:0;height:76px;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;box-shadow:0 -5px 24px #15384e18}.nav-button{border:0;background:transparent;color:var(--u);border-radius:16px;padding:5px 1px;display:grid;place-items:center;gap:2px;font-size:10px;font-weight:700}.nav-button span{font-size:20px;line-height:1}.nav-button.active{background:var(--m);color:var(--n)}main{padding-top:12px;padding-bottom:calc(105px + env(safe-area-inset-bottom,0px))}.stats{gap:10px}.stat{border:0;border-radius:18px;background:linear-gradient(145deg,#fff,#f4fbff);box-shadow:0 3px 14px #15384e0d}.item{border-color:#e5eef3;background:#fff}.fundraising{padding:18px;border-radius:18px;background:linear-gradient(135deg,#155a8a,#2499d4);color:#fff}.fundraising strong{display:block;font-size:28px}.fundraising p{margin:5px 0 12px;color:#e8f7ff}.progress{height:10px;border-radius:10px;background:#ffffff40;overflow:hidden}.progress span{display:block;height:100%;background:#fff;border-radius:10px}.social-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.social-links .btn{text-align:center;text-decoration:none;background:#eef8fd;color:var(--n)}
@media print{.top,.btn,form,.section-toggle,.section-hint,.dashboard-nav{display:none!important}body{background:#fff}.panel{break-inside:avoid}.section-card.closed .section-body{display:block!important}.nav-hidden{display:block!important}}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.top{padding-top:42px}.dashboard-nav{bottom:52px}main{padding-bottom:180px}
.collection-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 16px 0;padding:11px 14px;border-radius:14px;background:#e5f5fd;color:#155a8a;text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 2px 10px #155a8a12}.collection-strip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.collection-strip b{font-size:18px;white-space:nowrap}.collection-strip.hidden{display:none!important}
.quick-links{display:flex;gap:7px;overflow-x:auto;margin:9px 16px 0;padding-bottom:2px}.quick-links a{flex:none;padding:9px 12px;border-radius:12px;background:#fff;color:#155a8a;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #d8e8f0}.future-projects{padding:14px;border-radius:14px;background:#f1f8fc;color:#6f8491;font-size:13px;line-height:1.5}.future-projects strong{display:block;color:#15384e;margin-bottom:4px}
</style></head><body>
<section id="login" class="login"><div class="card"><div class="brand"><div class="logo">А</div><div><h1>Акыл центр</h1><p>Общий журнал медресе</p></div></div><form id="loginForm"><label>Кто входит</label><select id="loginRole"><option value="director">Директор</option><option value="teacher">Учитель</option><option value="educator">Воспитатель</option><option value="admin">Администратор</option><option value="cleaner">Уборщик</option><option value="deputy">Заместитель</option></select><div id="personField"><label>Имя сотрудника</label><select id="loginPerson" required><option value="">Загрузка сотрудников…</option></select></div><div id="passwordOnce" class="hidden"><label>Пароль нужен только один раз</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Введите свой пароль"></div><button class="btn">Войти</button><div id="error" class="error"></div></form></div></section>
<section id="app" class="hidden"><header class="top"><div class="toprow"><div><h1>Акыл центр</h1><div id="user" class="user"></div></div><div class="top-actions"><div class="bell-wrap"><button id="helpButton" class="bell help-button" type="button" aria-label="Инструкция">?</button><div id="helpPopover" class="notification-popover hidden"><h3>Как пользоваться</h3><div id="helpText" class="instruction-text"></div></div></div><div class="bell-wrap"><button id="notificationBell" class="bell" type="button" aria-label="Уведомления">🔔</button><span id="notificationCount" class="notification-count hidden">0</span><div id="notificationPopover" class="notification-popover hidden"><h3>Уведомления</h3><div id="notificationList" class="list"></div></div></div><button id="logout" class="logout">Выйти</button></div></div><span id="role" class="role"></span></header><a id="collectionStrip" class="collection-strip hidden" href="https://mechet-zangar.ru/"><span>Сбор центра</span><b id="collectionStripValue">Обновление…</b></a><nav id="quickLinks" class="quick-links"><a href="https://mechet-zangar.ru/">Сайт</a><a href="https://t.me/zangar_masjid">Telegram</a><a href="https://max.ru/join/hZ_if71_D-7cTA1pHZ6_-pgPJuiJIJgaaVvSl-anxSM">MAX</a><a href="https://vk.ru/mechet_zangar">ВКонтакте</a></nav><main id="dash"></main></section>
<script type="text/plain" id="legacy-app">
const A={director:{p:'1234',n:'Руководитель центра',r:'director',l:'Директор'},teacher:{p:'1234',n:'Учитель медресе',r:'teacher',l:'Учитель'},admin:{p:'1234',n:'Администратор центра',r:'admin',l:'Администратор'}},S=['Ученик 1','Ученик 2','Ученик 3','Ученик 4'],P=['Русский','Математика','Татарский','Арабский','Информатика','Программирование','Логика','История'];let G=JSON.parse(localStorage.getItem('grades')||'[]'),T=JSON.parse(localStorage.getItem('tasks')||'[]');const $=x=>document.getElementById(x),save=()=>{localStorage.setItem('grades',JSON.stringify(G));localStorage.setItem('tasks',JSON.stringify(T))};
$('loginForm').onsubmit=e=>{e.preventDefault();let k=$('username').value.trim().toLowerCase(),a=A[k];if(!a||a.p!==$('password').value){$('error').textContent='Неверный логин или пароль';return}localStorage.setItem('session',k);open(k)};$('logout').onclick=()=>{localStorage.removeItem('session');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
function open(k){let a=A[k];if(!a)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=a.n;$('role').textContent=a.l;render(a.r)}
const grades=()=>G.length?G.slice().reverse().map(g=>`<div class="item"><div class="row"><strong>${g.s} · ${g.p}</strong><span class="badge">Оценка ${g.g}</span></div><p>${g.a}. ${g.c||'Без комментария'} · ${g.d}</p></div>`).join(''):'<div class="empty">Записей пока нет</div>';
const tasks=(mine=false)=>{let x=mine?T.filter(t=>t.to==='Администратор'):T;return x.length?x.slice().reverse().map(t=>`<div class="item"><div class="row"><strong>${t.title}</strong><span class="badge ${t.done?'':'todo'}">${t.done?'Выполнено':'Новая'}</span></div><p>${t.text} · до ${t.date} · ${t.to}</p>${mine&&!t.done?`<button class="btn green" style="margin-top:9px" onclick="done('${t.id}')">Выполнено</button>`:''}</div>`).join(''):'<div class="empty">Задач пока нет</div>'};
function teacher(){$('dash').innerHTML=`<div class="hero"><h2>Журнал учителя</h2><p>Добавляйте успеваемость и посещаемость учеников. Этот раздел редактирует только учитель.</p></div><div class="subjects">${P.map(x=>`<span>${x}</span>`).join('')}</div><section class="panel"><h3>Новая запись</h3><form id="gf" class="grid"><div><label>Ученик</label><select id="gs">${S.map(x=>`<option>${x}</option>`)}</select></div><div><label>Предмет</label><select id="gp">${P.map(x=>`<option>${x}</option>`)}</select></div><div><label>Оценка</label><select id="gg"><option>5</option><option>4</option><option>3</option><option>2</option></select></div><div><label>Посещаемость</label><select id="ga"><option>На занятии</option><option>Пропуск</option><option>Болезнь</option></select></div><div class="full"><label>Комментарий</label><textarea id="gc"></textarea></div><button class="btn green full">Сохранить</button></form></section><section class="panel"><h3>Последние записи</h3><div id="gl" class="list">${grades()}</div></section>`;$('gf').onsubmit=e=>{e.preventDefault();G.push({s:$('gs').value,p:$('gp').value,g:$('gg').value,a:$('ga').value,c:$('gc').value.trim(),d:new Date().toLocaleDateString('ru-RU')});save();$('gc').value='';$('gl').innerHTML=grades()}}
function director(){let o=T.filter(x=>!x.done).length;$('dash').innerHTML=`<div class="hero"><h2>Кабинет директора</h2><p>Ставьте задачи сотрудникам и контролируйте выполнение.</p></div><div class="stats"><div class="stat"><strong>${T.length}</strong><span>Всего задач</span></div><div class="stat"><strong>${o}</strong><span>Ожидают</span></div></div><section class="panel"><h3>Поставить задачу</h3><form id="tf" class="grid"><div class="full"><label>Название</label><input id="tt" required></div><div><label>Исполнитель</label><select id="to"><option>Администратор</option><option>Учитель</option></select></div><div><label>Срок</label><input id="td" type="date" required></div><div class="full"><label>Описание</label><textarea id="tx" required></textarea></div><button class="btn green full">Отправить задачу</button></form></section><section class="panel"><h3>Задачи сотрудников</h3><div class="list">${tasks()}</div></section>`;$('tf').onsubmit=e=>{e.preventDefault();T.push({id:String(Date.now()),title:$('tt').value.trim(),to:$('to').value,date:$('td').value,text:$('tx').value.trim(),done:false});save();director()}}
function admin(){let m=T.filter(x=>x.to==='Администратор'),d=m.filter(x=>x.done).length;$('dash').innerHTML=`<div class="hero"><h2>Кабинет администратора</h2><p>Здесь видны только задачи, назначенные директором администратору.</p></div><div class="stats"><div class="stat"><strong>${m.length}</strong><span>Назначено</span></div><div class="stat"><strong>${d}</strong><span>Выполнено</span></div></div><section class="panel"><h3>Мои задачи</h3><div class="list">${tasks(true)}</div></section>`}
function render(r){r==='teacher'?teacher():r==='director'?director():admin()}window.done=id=>{let t=T.find(x=>x.id===id);if(t){t.done=true;save();admin()}};let q=localStorage.getItem('session');if(A[q])open(q);
</script><script src="supabase-app.js"></script><script src="fundraising-strip.js"></script></body></html>
