plugins {
    id "com.android.application"
}

android {
    namespace "center.akyl.app"
    compileSdk 35

    defaultConfig {
        applicationId "center.akyl.app.live11"
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName "2.1.3"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("AKYL_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("AKYL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("AKYL_KEY_ALIAS")
                keyPassword System.getenv("AKYL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
